services:
  - type: web
    name: chronoglass
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: MASTER_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
